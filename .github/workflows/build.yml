name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: ESP32-P4 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main/wifi_creds.h is intentionally absent in CI. discus_creds.h guards
      # its include with __has_include, so the build falls back to the empty
      # menuconfig defaults and still compiles.
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32p4
          path: '.'
          # TEMPORARY: seed the Kconfig value the solver needs on its first pass
          command: >-
            mkdir -p build/config &&
            printf "{\"LV_USE_FREETYPE\": false, \"LV_USE_LIBJPEG_TURBO\": false, \"LV_USE_LIBPNG\": false, \"LV_USE_LZ4\": false, \"LV_USE_LZ4_INTERNAL\": false}" > build/config/sdkconfig.json &&
            idf.py build

      - name: Upload dependencies.lock (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-lock
          path: dependencies.lock

      - name: Report binary size
        run: |
          ls -la build/discus.bin
          echo "size: $(stat -c%s build/discus.bin) bytes"

  agent:
    name: agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet psutil certifi cryptography ruff

      - name: Lint
        run: ruff check agent/ --select E9,F63,F7,F82

      - name: Unit tests
        run: python agent/test_agent.py
